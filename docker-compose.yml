services:
  db:
    restart: unless-stopped
    image: postgres:14-alpine
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: earthworm
    volumes:
      # PGDATA 的真实路径是 /var/lib/postgresql/data；挂在别处会让数据落进匿名卷，
      # 容器一重建（compose 配置变更、down/up）数据就归零
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 5433:5432
  testdb:
    image: postgres:14-alpine
    user: postgres
    volumes:
      - testdb-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: password
      POSTGRES_DB: earthworm_test
    ports:
      - 5480:5432
volumes:
  db-data:
    driver: local
  testdb-data:
    driver: local
