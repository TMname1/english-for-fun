services:
  db:
    restart: unless-stopped
    image: postgres:14-alpine
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: earthworm
    volumes:
      # PGDATA 的真实路径是 /var/lib/postgresql/data；挂在别处会让数据落进匿名卷，
      # 容器一重建（compose 配置变更、down/up）数据就归零
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 5433:5432
  testdb:
    image: postgres:14-alpine
    user: postgres
    volumes:
      - testdb-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: password
      POSTGRES_DB: earthworm_test
    ports:
      - 5480:5432
  # dev 对象存储（prod 用阿里云 OSS，代码同一套 S3 协议，见 README.prod.env.md）
  minio:
    restart: unless-stopped
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - 9000:9000
      - 9001:9001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
  # 一次性初始化：建私有桶 earthworm（与 S3_BUCKET 默认值一致）+ tts/ 缓存 30 天过期
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing local/earthworm &&
      mc anonymous set none local/earthworm &&
      case \"$(mc ilm rule ls local/earthworm 2>/dev/null)\" in
      *tts/*) ;;
      *) mc ilm rule add --expire-days 30 --prefix 'tts/' local/earthworm ;;
      esac
      "
volumes:
  db-data:
    driver: local
  testdb-data:
    driver: local
  minio-data:
    driver: local
