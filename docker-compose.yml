services:
  db:
    restart: always
    image: postgres:14-alpine
    user: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: earthworm
    volumes:
      # PGDATA 的真实路径是 /var/lib/postgresql/data；挂在别处会让数据落进匿名卷，
      # 容器一重建（compose 配置变更、down/up）数据就归零
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 5433:5432
  testdb:
    image: postgres:14-alpine
    user: postgres
    volumes:
      - testdb-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: password
      POSTGRES_DB: earthworm_test
    ports:
      - 5480:5432
  # 音频转写服务（Course Forge 流水线用）。默认不随 docker:start 启动，
  # 由 forge 脚本按需拉起：docker compose --profile asr up -d asr
  asr:
    # 固定 0.8.3：latest-cpu 是 2025-09 的旧构建（speaches 0.1.0），缺少启动装模型等新机制且带的
    # ctranslate2 过旧，读不了新版 large-v3 权重仓库的 vocabulary.json
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    restart: unless-stopped
    profiles: ["asr"]
    environment:
      # 启动时自动下载并安装模型（whisper-1 是 speaches 内置别名，映射到它；约 3GB）
      PRELOAD_MODELS: '["Systran/faster-whisper-large-v3"]'
      # CPU int8 量化（双下划线是 speaches 嵌套配置的环境变量写法），几分钟音频约为 2~4 倍实时速度
      WHISPER__COMPUTE_TYPE: int8
      # 禁用 HuggingFace Xet 加速通道（cas-server.xethub.hf.co 在部分网络会 TLS 中途断连），
      # 回退普通 HTTP 下载，模型下载更稳
      HF_HUB_DISABLE_XET: "1"
    # 注意：不要用 HF_ENDPOINT 指向 hf-mirror——它的 /api 会 308 重定向回官网，反而让
    # huggingface_hub 校验失败；容器默认能直连 huggingface.co，连不上时给 Docker 配代理。
    # 如需 GPU 加速（需装 NVIDIA Container Toolkit）：把上面的 image 标签
    # 换成同项目的 CUDA 版 `ghcr.io/speaches-ai/speaches:0.8.3-cuda`，
    # 可把 WHISPER__COMPUTE_TYPE 改为 float16，并取消注释下面的 deploy 段：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    ports:
      - 9000:8000
    volumes:
      # 模型权重缓存在项目内（large-v3 约 3GB，首次运行自动下载）；speaches 镜像容器内用户为 ubuntu
      - ./.volumes/asr-model-cache:/home/ubuntu/.cache
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 300s
volumes:
  db-data:
    driver: local
  testdb-data:
    driver: local
